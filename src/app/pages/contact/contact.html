<div class="contact-container">

      <div class="contact-card">
<h2>Contactez SenTECH 221</h2>
<p class="subtitle">Une question ? Un produit ? Ecrivez nous directement !</p>
       <form (submit)="onSubmit($event)">
       <div class="form-group">
<label for="name">Nom complet</label>
<input type="text" id="name" placeholder="Ex:Mouhamed Diallo" required>
</div>

        <div class="form-group">
<label for="email">Address Email</label>
<input type="email"id="email" placeholder="@gmail.com" required>
     </div>

           <div class="form-group">
    <label for="subject">Sujet</label>
<input type="text" id="subject" placeholder="Objet de votre message....." required>
      </div>

            <div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" rows="4" placeholder="Bonjour, je voudrais me renseigner sur....."required></textarea>
       </div>
     <button type="submit" class="submit-btn">Envoi du Message</button>

</form>
</div>
</div>
